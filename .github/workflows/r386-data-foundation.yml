name: R386 isolated event foundation
on:
  pull_request:
    paths:
      - 'tools/data-foundation/r386/**'
      - '.github/workflows/r386-data-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: noor_r386_synthetic
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d noor_r386_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: ${{ job.services.postgres.ports[5432] }}
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: noor_r386_synthetic
    steps:
      - uses: actions/checkout@v4
      - name: Set up isolated role fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;'
      - name: Create experiment schema
        run: psql -X -v ON_ERROR_STOP=1 -1 -f tools/data-foundation/r386/staging-lab-schema.sql
      - name: Regression, privilege and rollback proof
        run: psql -X -v ON_ERROR_STOP=1 -f tools/data-foundation/r386/staging-lab-regression.sql
      - name: Representative synthetic volume
        run: psql -X -v ON_ERROR_STOP=1 -f tools/data-foundation/r386/staging-lab-scale.sql
      - name: Verify no fixture data remains
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM noor_r386_lab.synthetic_source) OR EXISTS (SELECT 1 FROM noor_r386_lab.event_history) OR EXISTS (SELECT 1 FROM noor_r386_lab.checkpoint) THEN RAISE EXCEPTION 'residual fixture data'; END IF; END \$\$;"
